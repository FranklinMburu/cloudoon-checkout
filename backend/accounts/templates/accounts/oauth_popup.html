<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudoon sign-in</title>
  <style>
    body { margin: 0; min-height: 90vh; display: grid; place-items: center; padding: 24px;
           font: 15px/1.5 system-ui, sans-serif; color: #111827; text-align: center; }
  </style>
</head>
<body>
  {% if error %}
    <p>{{ error }}</p>
    <p>You can close this window.</p>
  {% else %}
    <p>You’re signed in. Return to your checkout; this window will close.</p>
    {# The checkout picks the sign-in up by polling, so this page only needs to get out of the way. #}
    <script>setTimeout(() => window.close(), 600);</script>
  {% endif %}
</body>
</html>
