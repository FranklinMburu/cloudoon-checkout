# Render Blueprint: Django API + PostgreSQL + the static frontend.
databases:
  - name: cloudoon-db
    plan: free
    databaseName: cloudoon
    user: cloudoon

services:
  - type: web
    name: cloudoon-checkout-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py createcachetable && python manage.py seed && python manage.py ensure_admin && gunicorn config.wsgi --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudoon-db
          property: connectionString
      # Browsers may call the API only from the checkout site and Google AI Studio (previews run on *.usercontent.goog / *.run.app).
      - key: CORS_ALLOWED_ORIGINS
        value: https://cloudoon-checkout.onrender.com,https://aistudio.google.com,https://ai.studio
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://[a-z0-9-]+\.(scf\.)?usercontent\.goog$,^https://ais-[a-z]+-[a-z0-9-]+\.[a-z0-9-]+\.run\.app$
      # Integrations: client ids are public; secrets are entered in the Render dashboard (sync: false).
      - key: GITHUB_CLIENT_ID
        value: Ov23liGGOU7ptv2UAtCV
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Django admin login at /admin/ (created on deploy by `manage.py ensure_admin`).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: cloudoon-checkout
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cloudoon-checkout-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
