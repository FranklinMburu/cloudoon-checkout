# Render Blueprint: Django API + PostgreSQL + the static frontend.
databases:
  - name: cloudoon-db
    plan: free
    databaseName: cloudoon
    user: cloudoon

services:
  - type: web
    name: cloudoon-checkout-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed && gunicorn config.wsgi --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudoon-db
          property: connectionString
      # The frontend runs on other origins (AI Studio, Render static site); auth uses a header token, not cookies.
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  - type: web
    name: cloudoon-checkout
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cloudoon-checkout-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
