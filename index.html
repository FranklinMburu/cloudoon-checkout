<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cloudoon — configure and order web hosting, VPS, dedicated and cloud servers in three steps." />
    <meta name="theme-color" content="#395AF4" />
    <title>Cloudoon · Checkout</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23395AF4'/%3E%3Cpath d='M22.5 22H11a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 22 12.5a4.75 4.75 0 0 1 .5 9.5Z' fill='%23fff'/%3E%3Ccircle cx='23.5' cy='9' r='3' fill='%23E7A403'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS v4 (browser build). Brand tokens are defined in the @theme block below. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

        /* Primary — #395AF4: actions, active states, navigation */
        --color-brand-50: #eef1fe;
        --color-brand-100: #dde4fd;
        --color-brand-200: #bcc9fb;
        --color-brand-300: #93a7f9;
        --color-brand-400: #6680f7;
        --color-brand-500: #4d6bf5;
        --color-brand-600: #395af4;
        --color-brand-700: #2a45d1;
        --color-brand-800: #2338a8;
        --color-brand-900: #1f3285;

        /* Accent — #E7A403: conversion CTAs, promo & discount badges */
        --color-accent-50: #fef8e7;
        --color-accent-100: #fcedc2;
        --color-accent-200: #f9dc88;
        --color-accent-300: #f4c443;
        --color-accent-400: #e7a403;
        --color-accent-500: #c98e02;
        --color-accent-600: #a47302;
        --color-accent-700: #7e5802;
        --color-accent-800: #5e4203;
        --color-accent-900: #3f2c02;
      }

      html {
        -webkit-tap-highlight-color: transparent;
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--font-sans);
        color: #030712;
        background: #f9fafb;
        -webkit-font-smoothing: antialiased;
      }

      /* Range slider: 44px-tall hit area, 28px thumb, filled track. */
      .range { -webkit-appearance: none; appearance: none; background: transparent; }
      .range:focus-visible { outline: none; }
      .range::-webkit-slider-runnable-track {
        height: 8px; border-radius: 9999px;
        background: linear-gradient(to right, #395af4 var(--fill), #e5e7eb var(--fill));
      }
      .range::-webkit-slider-thumb {
        -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 9999px;
        background: #fff; border: 3px solid #395af4; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
        cursor: grab; transition: transform 0.1s, box-shadow 0.15s;
      }
      .range:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgb(57 90 244 / 0.15); }
      .range:active::-webkit-slider-thumb { transform: scale(1.12); cursor: grabbing; }
      .range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgb(57 90 244 / 0.4); }
      .range::-moz-range-track { height: 8px; border-radius: 9999px; background: #e5e7eb; }
      .range::-moz-range-progress { height: 8px; border-radius: 9999px; background: #395af4; }
      .range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 9999px; background: #fff; border: 3px solid #395af4; cursor: grab; }
      .range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px rgb(57 90 244 / 0.4); }

      /* Persistent state feedback: totals flash briefly when they change. */
      @keyframes flash { from { background-color: #fcedc2; } to { background-color: transparent; } }
      .flash { animation: flash 0.9s ease-out; }
      @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .sheet { animation: sheet-up 0.25s ease-out; }
      @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      .pop { animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1); }

      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>

    <!-- Import map lets Google AI Studio run the app without a bundler. Vite ignores it. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.0",
          "react/": "https://esm.sh/react@19.1.0/",
          "react-dom": "https://esm.sh/react-dom@19.1.0",
          "react-dom/": "https://esm.sh/react-dom@19.1.0/"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use the Cloudoon checkout.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
