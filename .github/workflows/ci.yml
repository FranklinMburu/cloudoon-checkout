name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudoon
          POSTGRES_PASSWORD: cloudoon
          POSTGRES_DB: cloudoon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudoon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cloudoon:cloudoon@localhost:5432/cloudoon
      DEBUG: "True"  # settings fail closed (DEBUG off) unless told otherwise
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format check (Ruff)
        run: ruff check . && ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run -v 3
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
