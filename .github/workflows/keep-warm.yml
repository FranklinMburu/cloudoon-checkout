# Render's free tier puts the API to sleep after 15 idle minutes, and the next visitor
# waits ~45 s for it to wake. A light health check every 10 minutes keeps it awake.
name: Keep the API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://cloudoon-checkout-api.onrender.com/api/v1/health/
